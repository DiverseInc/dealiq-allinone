name: GitHub Pages (Fallback)

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: docs.dealiq.com