<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARV Estimator — DealIQ Calculators</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A1628'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23C8963E'%3EDQ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
    <style>
        .calculator { max-width: 800px; margin: 40px auto; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .results { background: #f8f9fa; padding: 24px; border-radius: 12px; margin-top: 24px; }
        .results h3 { margin-bottom: 16px; }
        .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .result-row:last-child { border-bottom: none; font-weight: 700; font-size: 18px; color: #1A7A6B; }
        .comp-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .comp-table th, .comp-table td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        .comp-table th { background: #f8f9fa; }
        .btn { background: #0A1628; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #060F1C; }
        .btn-secondary { background: #C8963E; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>ARV Estimator</h1>
        <p>Estimate After Repair Value based on comparable sales.</p>
        
        <div class="panel" style="margin-top: 24px;">
            <h3>Subject Property</h3>
            <div class="input-group">
                <label>Property Address</label>
                <input type="text" id="address" placeholder="123 Main St">
            </div>
            <div class="input-group">
                <label>Square Footage</label>
                <input type="number" id="sqft" value="1500">
            </div>
            <div class="input-group">
                <label>Bedrooms</label>
                <input type="number" id="beds" value="3">
            </div>
            <div class="input-group">
                <label>Bathrooms</label>
                <input type="number" id="baths" value="2">
            </div>
            <div class="input-group">
                <label>Year Built</label>
                <input type="number" id="year" value="1990">
            </div>
        </div>
        
        <div class="panel" style="margin-top: 24px;">
            <h3>Comparable Sales (Add 3-6 comps)</h3>
            <div id="comps">
                <div class="comp-row" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;">
                    <input type="text" placeholder="Address" class="comp-address">
                    <input type="number" placeholder="Sq Ft" class="comp-sqft">
                    <input type="number" placeholder="Price ($)" class="comp-price">
                    <input type="number" placeholder="Beds" class="comp-beds">
                    <input type="number" placeholder="Baths" class="comp-baths">
                </div>
                <div class="comp-row" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;">
                    <input type="text" placeholder="Address" class="comp-address">
                    <input type="number" placeholder="Sq Ft" class="comp-sqft">
                    <input type="number" placeholder="Price ($)" class="comp-price">
                    <input type="number" placeholder="Beds" class="comp-beds">
                    <input type="number" placeholder="Baths" class="comp-baths">
                </div>
                <div class="comp-row" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;">
                    <input type="text" placeholder="Address" class="comp-address">
                    <input type="number" placeholder="Sq Ft" class="comp-sqft">
                    <input type="number" placeholder="Price ($)" class="comp-price">
                    <input type="number" placeholder="Beds" class="comp-beds">
                    <input type="number" placeholder="Baths" class="comp-baths">
                </div>
            </div>
            <button class="btn btn-secondary" onclick="addComp()">+ Add Comp</button>
        </div>
        
        <button class="btn" onclick="calculateARV()" style="margin-top: 24px;width:100%;">Calculate ARV</button>
        
        <div class="results" id="results" style="display:none;">
            <h3>ARV Estimate</h3>
            <div class="result-row"><span>Price per Sq Ft (avg)</span><span id="ppsf">$0</span></div>
            <div class="result-row"><span>Subject Sq Ft</span><span id="subjectSqft">0</span></div>
            <div class="result-row"><span>Bedroom Adjustment</span><span id="bedAdj">$0</span></div>
            <div class="result-row"><span>Estimated ARV</span><span id="arv">$0</span></div>
        </div>
        
        <div style="margin-top: 24px;">
            <button class="btn" onclick="exportPDF()">📄 Export PDF</button>
            <a href="landing.html" style="margin-left: 16px;">← Back to All Calculators</a>
        </div>
    </div>
    
    <script>
    function addComp(){
        const div=document.createElement('div');
        div.className='comp-row';
        div.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px;';
        div.innerHTML='<input type="text" placeholder="Address" class="comp-address"><input type="number" placeholder="Sq Ft" class="comp-sqft"><input type="number" placeholder="Price ($)" class="comp-price"><input type="number" placeholder="Beds" class="comp-beds"><input type="number" placeholder="Baths" class="comp-baths">';
        document.getElementById('comps').appendChild(div);
    }
    
    function calculateARV(){
        const sqft=parseFloat(document.getElementById('sqft').value)||0;
        const beds=parseInt(document.getElementById('beds').value)||0;
        const comps=document.querySelectorAll('.comp-row');
        let totalPrice=0,totalSqft=0,count=0;
        comps.forEach(c=>{
            const price=parseFloat(c.querySelector('.comp-price')?.value)||0;
            const csqft=parseFloat(c.querySelector('.comp-sqft')?.value)||0;
            if(price>0&&csqft>0){totalPrice+=price;totalSqft+=csqft;count++;}
        });
        if(count===0){alert('Add at least one comparable sale.');return;}
        const ppsf=totalPrice/totalSqft;
        const baseARV=ppsf*sqft;
        const avgBeds=comps.length?[...comps].reduce((s,c)=>s+(parseInt(c.querySelector('.comp-beds')?.value)||0),0)/comps.length:3;
        const bedAdj=(beds-avgBeds)*5000;
        const arv=baseARV+bedAdj;
        document.getElementById('ppsf').textContent='$'+ppsf.toFixed(0);
        document.getElementById('subjectSqft').textContent=sqft.toLocaleString();
        document.getElementById('bedAdj').textContent=(bedAdj>=0?'+':'')+'$'+bedAdj.toLocaleString();
        document.getElementById('arv').textContent='$'+arv.toLocaleString(undefined,{maximumFractionDigits:0});
        document.getElementById('results').style.display='block';
    }
    
    function exportPDF(){
        alert('PDF export coming soon! For now, take a screenshot.');
    }
    </script>
</body>
</html>
