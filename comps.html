<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comps Estimator — DealIQ Calculators</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A1628'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23C8963E'%3EDQ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
    <style>
        .calculator { max-width: 800px; margin: 40px auto; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .results { background: #f8f9fa; padding: 24px; border-radius: 12px; margin-top: 24px; }
        .comps-list { margin-top: 16px; }
        .comp-item { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 8px; }
        .comp-item h4 { margin-bottom: 8px; }
        .comp-item .price { font-size: 20px; font-weight: 700; color: #1A7A6B; }
        .comp-item .details { font-size: 14px; color: #666; }
        .btn { background: #0A1628; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
        .stat { text-align: center; }
        .stat .value { font-size: 24px; font-weight: 700; }
        .stat .label { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Comps Estimator</h1>
        <p>Estimate property value based on comparable sales data.</p>
        
        <div class="panel" style="margin-top: 24px;">
            <h3>Subject Property</h3>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="address" placeholder="123 Main St">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                <div class="input-group">
                    <label>Square Footage</label>
                    <input type="number" id="sqft" value="1500">
                </div>
                <div class="input-group">
                    <label>Bedrooms</label>
                    <input type="number" id="beds" value="3">
                </div>
                <div class="input-group">
                    <label>Bathrooms</label>
                    <input type="number" id="baths" value="2">
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="input-group">
                    <label>Lot Size (sq ft)</label>
                    <input type="number" id="lotSize" value="6000">
                </div>
                <div class="input-group">
                    <label>Year Built</label>
                    <input type="number" id="year" value="1990">
                </div>
            </div>
        </div>
        
        <button class="btn" onclick="estimateComps()" style="margin-top: 24px;width:100%;">Generate Comps Estimate</button>
        
        <div class="results" id="results" style="display:none;">
            <h3>Estimated Value</h3>
            <div class="stat-grid">
                <div class="stat">
                    <div class="value" id="estimatedValue" style="color:#1A7A6B;">$0</div>
                    <div class="label">Estimated Value</div>
                </div>
                <div class="stat">
                    <div class="value" id="priceRange">$0 - $0</div>
                    <div class="label">Value Range</div>
                </div>
                <div class="stat">
                    <div class="value" id="ppsf">$0</div>
                    <div class="label">Price/Sq Ft</div>
                </div>
            </div>
            
            <div class="comps-list" id="compsList"></div>
        </div>
        
        <div style="margin-top: 24px;">
            <a href="landing.html">← Back to All Calculators</a>
        </div>
    </div>
    
    <script>
    function estimateComps(){
        const sqft=parseFloat(document.getElementById('sqft').value)||1500;
        const beds=parseInt(document.getElementById('beds').value)||3;
        const baths=parseInt(document.getElementById('baths').value)||2;
        const lotSize=parseFloat(document.getElementById('lotSize').value)||6000;
        const year=parseInt(document.getElementById('year').value)||1990;
        
        // Mock comparable data (in production, this would come from an API)
        const mockComps=[
            {address:'456 Oak Ave',sqft:sqft+100,beds:beds,baths:baths,price:sqft*210+Math.random()*20000,status:'Sold'},
            {address:'789 Pine St',sqft:sqft-50,beds:beds,baths:baths-0.5,price:sqft*195+Math.random()*15000,status:'Sold'},
            {address:'321 Elm Dr',sqft:sqft+200,beds:beds+1,baths:baths,price:sqft*225+Math.random()*25000,status:'Active'},
            {address:'654 Maple Ln',sqft:sqft-100,beds:beds,baths:baths,price:sqft*185+Math.random()*10000,status:'Sold'},
            {address:'987 Cedar Ct',sqft:sqft,beds:beds,baths:baths+0.5,price:sqft*205+Math.random()*18000,status:'Pending'}
        ];
        
        const totalValue=mockComps.reduce((s,c)=>s+c.price,0);
        const avgValue=totalValue/mockComps.length;
        const ppsf=avgValue/sqft;
        const minVal=Math.min(...mockComps.map(c=>c.price));
        const maxVal=Math.max(...mockComps.map(c=>c.price));
        
        document.getElementById('estimatedValue').textContent='$'+avgValue.toLocaleString(undefined,{maximumFractionDigits:0});
        document.getElementById('priceRange').textContent='$'+minVal.toLocaleString(undefined,{maximumFractionDigits:0})+' - $'+maxVal.toLocaleString(undefined,{maximumFractionDigits:0});
        document.getElementById('ppsf').textContent='$'+ppsf.toFixed(0);
        
        const compsList=document.getElementById('compsList');
        compsList.innerHTML='<h4 style="margin-top:24px;">Comparable Properties</h4>'+
            mockComps.map(c=>`
                <div class="comp-item">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <h4>${c.address}</h4>
                        <span style="background:${c.status==='Sold'?'#D1FAE5':c.status==='Active'?'#DBEAFE':'#FEF3C7'};padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;">${c.status}</span>
                    </div>
                    <div class="price">$${c.price.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
                    <div class="details">${c.sqft.toLocaleString()} sqft | ${c.beds} bed | ${c.baths} bath | $${(c.price/c.sqft).toFixed(0)}/sqft</div>
                </div>
            `).join('');
        
        document.getElementById('results').style.display='block';
    }
    </script>
</body>
</html>
